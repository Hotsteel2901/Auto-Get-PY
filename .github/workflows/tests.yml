name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run the test suite
        run: python -m pytest tests/ -q

      - name: Check the generated agent files are up to date
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/generate_agent_docs.py --check

  mcp:
    name: MCP stdio handshake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Speak JSON-RPC to the server
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | python mcp_server.py | python -c "
          import json, sys
          lines = [l for l in sys.stdin if l.strip()]
          assert len(lines) == 2, lines
          init = json.loads(lines[0])
          assert init['result']['serverInfo']['name'] == 'auto-get-py'
          tools = json.loads(lines[1])['result']['tools']
          assert len(tools) == 8, [t['name'] for t in tools]
          print('MCP server OK:', ', '.join(t['name'] for t in tools))
          "

  browser:
    name: Web UI in headless Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio playwright
          python -m playwright install --with-deps chromium

      - name: Start the scraper and the test site
        run: |
          python app.py --host 127.0.0.1 --port 8765 &
          python scripts/serve_test_site.py --port 9911 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/api/health && break
            sleep 1
          done

      - name: Drive every page in a real browser
        run: python scripts/check_ui.py --base-url http://127.0.0.1:8765
