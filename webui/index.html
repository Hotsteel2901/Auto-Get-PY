<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Auto-Get-PY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232563eb'/%3E%3Cpath d='M9 21V13l3 5 3-5v8' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M20 13v6a2 2 0 0 0 4 0' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/webui/css/style.css">
<script>
  // Apply the saved theme before first paint so there is no flash.
  (function () {
    try {
      var saved = localStorage.getItem('autoget:theme');
      var theme = saved ? JSON.parse(saved) : 'light';
      document.documentElement.dataset.theme = theme;
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  })();
</script>
</head>
<body>
<a class="skip-link" href="#main" data-i18n="app.skipToContent">跳到主要内容</a>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 18V8l4 6 4-6v10"></path>
          <path d="M17 8v6a3 3 0 0 0 6 0"></path>
        </svg>
      </span>
      <span class="brand-text">
        <strong data-i18n="app.name">Auto-Get-PY</strong>
        <small data-i18n="app.tagline">通用媒体爬取器</small>
      </span>
    </div>

    <nav class="nav" id="nav" aria-label="Main"></nav>

    <div class="sidebar-foot">
      <button class="conn" id="conn-status" type="button"
              data-i18n-title="conn.title.reconnect">
        <span class="conn-dot"></span>
        <span class="conn-text" data-i18n="conn.connecting">连接中…</span>
      </button>
      <div class="foot-meta">
        <span id="version-label">v—</span>
        <span class="foot-actions">
          <button class="chip-btn" id="lang-toggle" type="button"
                  data-i18n-title="lang.toggle" title="切换语言">中</button>
          <button class="chip-btn" id="theme-toggle" type="button"
                  data-i18n-title="theme.toggle" title="切换深浅色">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
            </svg>
          </button>
        </span>
      </div>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <div class="content">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menu-toggle" type="button"
              aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
      <div class="topbar-title">
        <h1 id="page-title"></h1>
        <p id="page-subtitle"></p>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>

    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="modal-root" id="modal-root"></div>

<script type="module" src="/webui/js/app.js"></script>
</body>
</html>
